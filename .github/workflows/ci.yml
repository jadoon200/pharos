name: CI

# Frugal by design (private-repo Actions minutes are finite; public repos run free):
# ubuntu-only, single Python, narrow triggers, and in-progress runs are cancelled.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pinned runtime + dev tools
        run: |
          python -m pip install --upgrade pip
          # Prefer the pinned lock (reproducible); fall back to requirements.txt until the
          # Lock workflow has generated requirements.lock on Linux.
          if [ -f requirements.lock ]; then
            pip install -r requirements.lock
          else
            pip install -r requirements.txt
          fi
          pip install ruff mypy pytest pytest-cov respx

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy src/pharos

      - name: Pytest
        run: pytest -q
